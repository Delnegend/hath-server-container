name: Container

# The only gate: this is a fixed upstream release (HATH_VERSION) repackaged for
# Docker, so there is nothing to unit-test — but a broken Dockerfile is a broken
# project. This builds the image exactly the way the README says to and asserts
# the expected files landed inside it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Static, finite, no cache reuse between runs at this cadence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: hath:smoke
          build-args: HATH_VERSION=1.6.4
      # The jar name and the state directories are what a release bump
      # could silently rename; fail if any of them is missing.
      - name: Assert the entrypoint files exist
        run: |
          docker run --rm --entrypoint sh hath:smoke -c '
            test -f /opt/hath/HentaiAtHome.jar
            test -x /opt/hath/start.sh
          '

      - name: Assert the state directories exist
        run: |
          docker run --rm --entrypoint sh hath:smoke -c '
            for d in cache data download log tmp; do
              test -d "/hath/$d" || exit 1
            done
          '

  # Security scans. They need Docker images and registry egress, so they only run
  # on GitHub-hosted runners. None of them is a required check — the gate stays
  # `Build and inspect`. No OSV job: this repo has no package manifest.
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the whole history: a leaked secret lives in it
      - name: Run Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep OSS
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy-scan:
    name: Misconfig & Vulns (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" aquasec/trivy fs /src --severity HIGH,CRITICAL --scanners vuln,misconfig --exit-code 1
