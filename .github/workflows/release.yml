name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  # A literal, lowercase, with no expressions. `${{ github.repository }}`
  # expands to `Delnegend/...`, and buildx rejects a mixed-case image
  # reference before it builds anything:
  #   invalid tag "ghcr.io/Delnegend/hath-server-container:...":
  #   repository name must be lowercase
  IMAGE: ghcr.io/delnegend/hath-server-container

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # SHA path: test-build this commit, publish nothing.
          if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{4,64}$'; then
            echo "Test build against commit $INPUT_REF (will not publish)."
            { echo "ref=$INPUT_REF"; echo "version=$INPUT_REF"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rebuild path: an explicit tag means ship exactly that, no bump.
          if [ -n "$INPUT_REF" ]; then
            echo "Rebuilding existing tag $INPUT_REF."
            { echo "ref=$INPUT_REF"; echo "version=${INPUT_REF#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing releasable since the last tag: clean exit, no noise.
          if [ "$BUMP" = "none" ]; then
            echo "No version bump needed (current: ${CURRENT:-none})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to re-ship: NEXT must sort after the latest tag.
          # (Catches re-runs after a release already shipped this version.)
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LATEST_TAG" ]; then
            if [ "$NEXT" = "$LATEST_TAG" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
              echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
              exit 1
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          just bump "$NEXT_STRICT"
          git add -u
          if git diff --staged --quiet; then
            # Recovery: the bump already landed on main (a previous run's
            # push succeeded but tagging failed). Tag the existing commit
            # and ship it.
            MANIFEST_VER="$(cat VERSION)"
            if [ "v$MANIFEST_VER" != "$NEXT" ]; then
              echo "::error::bump produced no change, and manifest ($MANIFEST_VER) disagrees with calculated $NEXT_STRICT."
              exit 1
            fi
            echo "Manifest already at $NEXT; tagging the existing commit."
          else
            git commit -m "chore(release): ${NEXT}"
            # Push the commit first: if the tag push fails, main still has
            # the bump and the next run recovers via the branch above.
            git push origin HEAD:main
          fi
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          { echo "ref=$NEXT"; echo "version=$NEXT_STRICT"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The client version is a fact about the tree (HATH_VERSION pinned in
      # docker-compose.yml), not about the release tag: the release version
      # names the repackaging, the build arg names the upstream client inside.
      - name: Resolve HATH_VERSION from docker-compose.yml
        env:
          COMPOSE_FILE: docker-compose.yml
        run: sed -n 's/^[[:space:]]*-[[:space:]]*HATH_VERSION=//p' "$COMPOSE_FILE" | head -n1 > hath_version.txt && test -s hath_version.txt && cat hath_version.txt

      - name: Read HATH_VERSION into the environment
        run: echo "HATH_VERSION=$(cat hath_version.txt)" >> "$GITHUB_ENV"

      # One published image, with exactly two tags: the release version and
      # `latest`. No rolling major.minor or major tags, so `:1.0.3` always
      # means the same thing and there is nothing ambiguous to deploy.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          build-args: HATH_VERSION=${{ env.HATH_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The old CI gate's `Build and inspect` assertions, kept verbatim: the
      # jar name and the state directories are what a release bump could
      # silently rename, so fail if any of them is missing.
      - name: Pull image for inspection
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker pull "$IMAGE:$VERSION"

      - name: Assert the entrypoint files exist
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            test -f /opt/hath/HentaiAtHome.jar
            test -x /opt/hath/start.sh
          '

      - name: Assert the state directories exist
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            for d in cache data download log tmp; do
              test -d "/hath/$d" || exit 1
            done
          '

      # `just save` exports the local `hath` tag, so retag first, then upload
      # the tarball to the Actions run.
      - name: Export image tarball
        env:
          REF: ${{ needs.prepare.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" hath
          just save
          ls -lh hath.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hath-image-${{ needs.prepare.outputs.ref }}
          path: hath.tar.gz
          if-no-files-found: error

      # The tag already exists by the time this runs: `prepare` created and
      # pushed it before the build started. That is the point — the release
      # names a version that is already a fact about the repository — but it
      # also means a build failure here leaves a tag with no release. The
      # repair is to re-run with `ref` set to the tag, which rebuilds it and
      # publishes its release without touching the version.
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            docker pull ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ```

            Or `latest` for the most recent release. The git tag `${{ needs.prepare.outputs.ref }}`
            is the same image, named the way git wants it.

            `hath.tar.gz` (attached below) is the same image as a portable
            tarball: `docker load < hath.tar.gz`.
          files: hath.tar.gz
