name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release mode / build target"
        required: true
        type: choice
        default: "new-tag"
        options:
          - new-tag  # Bump version -> open PR (merge it, then run target=tag to build)
          - tag      # Tag HEAD if missing -> build & publish release
          - commit   # Test build latest commit -> upload Actions artifacts only (no release)
      ref:
        description: "Custom tag or commit SHA (optional, defaults to latest)"
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (defaults to target: new-tag)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # A literal, lowercase, with no expressions. `${{ github.repository }}`
  # expands to `Delnegend/...`, and buildx rejects a mixed-case image
  # reference before it builds anything:
  #   invalid tag "ghcr.io/Delnegend/hath-server-container:...":
  #   repository name must be lowercase
  IMAGE: ghcr.io/delnegend/hath-server-container

jobs:
  prepare:
    name: Prepare / Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # ------------------------------------------------------------------
      # Mode 1: new-tag (semver -> CI gate -> bump -> open PR for review)
      # ------------------------------------------------------------------
      - name: Calculate Next SemVer
        if: (inputs.target || 'new-tag') == 'new-tag'
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: CI Gate (verify code is green before bumping)
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        run: just check

      - name: Bump package manager version
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          just bump "$NEXT_STRICT"

      - name: Commit and open release PR
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        id: release-pr
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -u
          git diff --staged --quiet && { echo "::error::bump produced no change in package files"; exit 1; }
          git commit -m "chore(release): ${NEXT_TAG}"

          BRANCH="release/${NEXT_TAG}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          gh pr create --title "chore(release): ${NEXT_TAG}" \
            --body "Automated version bump to \`${NEXT_TAG}\`. Merge this PR, then run the release workflow with \`target=tag\` to build and publish." \
            --head "$BRANCH" --base main

      # -----------------------------------------------------------------------
      # Resolve outputs for Job 2 (build)
      # -----------------------------------------------------------------------
      - name: Resolve outputs
        id: resolve
        env:
          TARGET: ${{ inputs.target || 'new-tag' }}
          INPUT_REF: ${{ inputs.ref }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # new-tag only opens the release PR (branch protection blocks a
          # direct push to main). Merge the PR, then re-run with target=tag.
          if [ "$TARGET" = "new-tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ "$BUMP" = "none" ]; then
              echo "No version bump needed (current: ${CURRENT:-none})."
            else
              echo "Release PR opened; merge it, then re-run with target=tag to build and publish."
            fi
            exit 0
          elif [ "$TARGET" = "tag" ]; then
            if [ -n "$INPUT_REF" ]; then
              # Re-run for an existing tag: build and publish it.
              TAG="$INPUT_REF"
            else
              # Version lives in the VERSION file: read it, v-prefix it, and
              # create + push the tag only if missing.
              TAG="v$(cat VERSION)"
              [ -n "$TAG" ] && [ "$TAG" != "v" ] || { echo "::error::No version found in VERSION file"; exit 1; }
              if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                echo "Tag $TAG already exists; building it."
              else
                git config user.name "github-actions[bot]"
                git config user.email "actions@users.noreply.github.com"
                git tag -a "$TAG" -m "Release $TAG"
                git push origin "refs/tags/$TAG"
              fi
            fi
            { echo "ref=$TAG"; echo "version=${TAG#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          else
            SHA="${INPUT_REF:-$(git rev-parse HEAD)}"
            { echo "ref=$SHA"; echo "version=$SHA"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            echo "Running test build against commit $SHA (will not publish release)"
          fi

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The client version is a fact about the tree (HATH_VERSION pinned in
      # docker-compose.yml), not about the release tag: the release version
      # names the repackaging, the build arg names the upstream client inside.
      - name: Resolve HATH_VERSION from docker-compose.yml
        env:
          COMPOSE_FILE: docker-compose.yml
        run: sed -n 's/^[[:space:]]*-[[:space:]]*HATH_VERSION=//p' "$COMPOSE_FILE" | head -n1 > hath_version.txt && test -s hath_version.txt && cat hath_version.txt

      - name: Read HATH_VERSION into the environment
        run: echo "HATH_VERSION=$(cat hath_version.txt)" >> "$GITHUB_ENV"

      # One published image, with exactly two tags: the release version and
      # `latest`. No rolling major.minor or major tags, so `:1.0.3` always
      # means the same thing and there is nothing ambiguous to deploy.
      # `target: commit` is a test build: nothing is pushed, the image is only
      # loaded into the runner's local store, and the GitHub Release is not
      # published.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          build-args: HATH_VERSION=${{ env.HATH_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The old CI gate's `Build and inspect` assertions, kept verbatim: the
      # jar name and the state directories are what a release bump could
      # silently rename, so fail if any of them is missing. Published builds
      # were pushed, not loaded, so pull first; commit test builds use the
      # locally loaded image directly.
      - name: Pull image for inspection
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker pull "$IMAGE:$VERSION"

      - name: Assert the entrypoint files exist
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            test -f /opt/hath/HentaiAtHome.jar
            test -x /opt/hath/start.sh
          '

      - name: Assert the state directories exist
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            for d in cache data download log tmp; do
              test -d "/hath/$d" || exit 1
            done
          '

      # registries. `just save` exports the local `hath` tag, so retag first
      # (pull when published, use the loaded image on a commit test build),
      # then upload the tarball to the Actions run on every target.
      - name: Export image tarball
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          REF: ${{ needs.prepare.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            docker pull "$IMAGE:$VERSION"
            docker tag "$IMAGE:$VERSION" hath
          else
            docker tag "$IMAGE:$VERSION" hath 2>/dev/null || docker tag "$IMAGE:latest" hath
          fi
          just save
          ls -lh hath.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hath-image-${{ needs.prepare.outputs.ref }}
          path: hath.tar.gz
          if-no-files-found: error

      # The tag already exists by the time this runs: `prepare` created and
      # pushed it before the build started. That is the point — the release
      # names a version that is already a fact about the repository — but it
      # also means a build failure here leaves a tag with no release. The
      # repair is to re-run with `target: tag`, which rebuilds the tag and
      # publishes its release without touching the version.
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            docker pull ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ```

            Or `latest` for the most recent release. The git tag `${{ needs.prepare.outputs.ref }}`
            is the same image, named the way git wants it.

            `hath.tar.gz` (attached below) is the same image as a portable
            tarball: `docker load < hath.tar.gz`.
          files: hath.tar.gz
