name: Container

# The only gate: this is a fixed upstream release (HATH_VERSION) repackaged for
# Docker, so there is nothing to unit-test — but a broken Dockerfile is a broken
# project. This builds the image exactly the way the README says to and asserts
# the expected files landed inside it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Static, finite, no cache reuse between runs at this cadence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hath:smoke
          build-args: HATH_VERSION=1.6.4

      # The jar name and the start script are the two things a release bump
      # could silently rename; fail if either is missing.
      - name: Assert the entrypoint files exist
        run: |
          docker run --rm --entrypoint sh hath:smoke -c '
            test -f /opt/hath/HentaiAtHome.jar
            test -x /opt/hath/start.sh
          '

      - name: Assert the download lands where start.sh expects it
        run: |
          docker inspect hath:smoke --format '{{json .Config.Volumes}}' \
            | grep -q '/hath/data' || exit 1
