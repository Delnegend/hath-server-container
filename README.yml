$schema: "https://raw.githubusercontent.com/Delnegend/actions/main/scripts/README.schema.json"

name: H@H Server Container
repo: Delnegend/hath-server-container
tagline: "Run the Hentai@Home client as a set-and-forget Docker service: Java runtime included, your cache, credentials and downloads mounted from the host."

badges:
  ci: true
  release: true
  license: true

quick_start: |
  ```bash
  # 1. Set your client ID and key in docker-compose.yml
  #    (HATH_CLIENT_ID, HATH_CLIENT_KEY, plus TZ for your timezone)

  # 2. Start it
  docker compose up -d --build

  # 3. Watch it come up
  docker logs -f hath
  ```

highlights:
  - "**No Java on the host**: The image ships the Semeru JRE and downloads the pinned client release into it."
  - "**State lives on your disk**: Cache, data, downloads, and logs are all bind mounts, so rebuilding the image never loses anything."
  - "**Fresh credentials every start**: The entry script rewrites `client_login` from the compose environment before launching."
  - "**Survives reboots**: `restart: unless-stopped` with Cloudflare DNS so the client resolves even on captive networks."

documentation:
  architecture: "Container runtime architecture, persistence volumes, and host mounts."
  development: "Building images locally, shellcheck/actionlint checks, and release workflows."
  deployment: "Deployment via Docker Compose or Podman, logging, and upgrades."

license:
  type:
    - MIT
  holder: "Delnegend"
  filename: "LICENSE"
